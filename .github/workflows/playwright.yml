name: NewPage AI - Playwright Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Test suite to run"
        required: true
        default: all
        type: choice
        options:
          - all
          - api
          - ui-query
          - ui-documents

env:
  BASE_URL: ${{ secrets.BASE_URL }}

permissions:
  contents: write

jobs:
  test:
    name: Run Playwright Tests

    runs-on: ubuntu-latest
    environment: test

    timeout-minutes: 60

    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble

    env:
      CI: true
      BASE_URL: ${{ secrets.BASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create Report Name
        run: |
          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
          REPORT_NAME="${TIMESTAMP}_${{ github.event.inputs.suite }}_run-${{ github.run_number }}"

          echo "REPORT_NAME=$REPORT_NAME" >> $GITHUB_ENV

      - name: Run Playwright Tests
        run: |
          case "${{ github.event.inputs.suite }}" in
            api)
              npx playwright test src/tests/api/api.spec.ts
              ;;
            ui-query)
              npx playwright test src/tests/ui/query.spec.ts
              ;;
            ui-documents)
              npx playwright test src/tests/ui/documents-visible.spec.ts
              ;;
            *)
              npx playwright test
              ;;
          esac

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      #
      # Checkout existing gh-pages
      #
      - name: Checkout gh-pages
        if: always()
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      #
      # Build deployment folder
      #
      - name: Prepare Site
        if: always()
        run: |
          mkdir -p site/reports

          #
          # Preserve existing site files
          #
          cp gh-pages/index.html site/index.html || true
          cp gh-pages/reports.json site/reports.json || echo "[]" > site/reports.json

          #
          # Preserve historical reports
          #
          cp -R gh-pages/reports/* site/reports/ || true

          #
          # Add current report
          #
          cp -R "playwright-report/${REPORT_NAME}" "site/reports/${REPORT_NAME}"

      #
      # Update reports.json
      #
      - name: Update reports.json
        if: always()
        run: |
          python3 <<EOF
          import json

          report = "${REPORT_NAME}"

          with open("site/reports.json","r") as f:
              reports = json.load(f)

          if report not in reports:
              reports.insert(0, report)

          with open("site/reports.json","w") as f:
              json.dump(reports, f, indent=2)
          EOF

      #
      # Single deployment
      #
      - name: Deploy GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site